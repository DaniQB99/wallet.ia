    <meta name="apple-mobile-web-app-title" content="wallet.ia" />

    <!-- Pre-render Theme Detection (Zero-flash device theme adaptation) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('wallet_ia_theme');
          var isLight = saved === 'light' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (isLight) {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch (e) {}
      })();
    </script>

  <body>

  </body>
